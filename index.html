<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💎 マネータイプ診断 💎</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary-pink: #FF69B4; --deep-pink: #FF1493; --soft-pink: #FFF0F5; --mint-blue: #B2EBF2; --text-dark: #444; }
        body { font-family: 'M PLUS Rounded 1c', sans-serif; background-color: #ffeef8; color: var(--text-dark); text-align: center; padding: 15px; margin: 0; }
        .container { max-width: 480px; margin: 10px auto; background: white; border-radius: 40px; padding: 30px 20px; box-shadow: 0 15px 30px rgba(0,0,0,0.1); border: 6px solid var(--mint-blue); position: relative; }
        h1 { color: var(--primary-pink); font-size: 26px; font-weight: 800; margin-bottom: 10px; }
        .code-input { padding: 15px; font-size: 28px; width: 160px; border-radius: 25px; border: 4px dashed var(--mint-blue); text-align: center; color: var(--deep-pink); font-weight: bold; background: #faffff; outline: none; }
        .btn-main { background: linear-gradient(to bottom, #FFEB3B, #FBC02D); color: #795548; border: none; border-radius: 50px; padding: 18px 30px; font-size: 20px; font-weight: 800; cursor: pointer; box-shadow: 0 8px 0 #F9A825; width: 90%; }
        .btn-main:active { transform: translateY(4px); box-shadow: 0 4px 0 #F9A825; }
        .btn-main:disabled { opacity: 0.5; filter: grayscale(1); }
        .question-box { font-size: 20px; font-weight: 800; color: #007c91; margin-bottom: 25px; padding: 25px; background: #f1fdff; border-radius: 30px; border: 2px solid var(--mint-blue); }
        .option-btn { background: white; border: 3px solid #FFD1DC; border-radius: 35px; padding: 16px 22px; font-size: 16px; cursor: pointer; margin-bottom: 12px; width: 100%; font-weight: bold; box-shadow: 0 5px 0 #FFD1DC; text-align: left; }
        .animal-emoji { font-size: 90px; margin: 10px 0; display: block; animation: bounce 2s infinite; }
        .result-title { font-size: 24px; color: var(--text-dark); font-weight: 800; margin: 5px 0 10px 0; }
        .result-catchphrase { font-size: 16px; color: white; background: var(--deep-pink); padding: 8px 20px; border-radius: 25px; display: inline-block; margin-bottom: 15px; box-shadow: 0 4px 0 #D81B60; font-weight: 800; letter-spacing: 1px;}
        .chart-container { position: relative; height: 320px; width: 100%; margin: 10px 0; }
        .history-container { margin-top: 30px; padding-top: 20px; border-top: 2px dashed #FFD1DC; }
        .history-title { font-size: 18px; color: var(--deep-pink); font-weight: 800; margin-bottom: 10px; }
        .history-chart-container { height: 250px; width: 100%; }
        .result-desc-box { text-align: left; background: #fffcfd; padding: 25px; border-radius: 30px; border: 3px solid #FFD1DC; line-height: 1.8; white-space: pre-wrap; font-size: 15px; margin-top: 20px; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        #quiz-area, #result-area { display: none; }
    </style>
</head>
<body>
<div class="container">
    <div id="start-screen">
        <h1>✨ マネータイプ診断 ✨</h1>
        <div style="margin: 30px 0;">
            <input type="tel" id="group-code" class="code-input" maxlength="4" placeholder="1001">
            <p id="code-error" style="color:#FF5252; font-weight:bold; display:none;">⚠️ コードが違うよ！</p>
        </div>
        <button id="start-btn" class="btn-main" onclick="startGame()" disabled>診断スタート！ 💖</button>
        <p id="loading-msg" style="font-size:11px; color:#bbb; margin-top: 15px;">読込中...</p>
    </div>

    <div id="quiz-area">
        <div id="progress-bar" style="width: 100%; height: 8px; background: #eee; border-radius: 10px; margin-bottom: 20px;">
            <div id="progress-fill" style="width: 0%; height: 100%; background: var(--primary-pink); border-radius: 10px; transition: 0.3s;"></div>
        </div>
        <div class="question-box" id="question-text"></div>
        <div id="options-container"></div>
    </div>

    <div id="result-area">
        <div id="result-content-container" style="background: white; padding: 10px; border-radius: 35px;">
            <h2 style="color: var(--primary-pink); font-size: 14px;">🎀 診断結果 🎀</h2>
            <div id="result-header"></div>
            <div class="chart-container"><canvas id="radarChart"></canvas></div>
            <div id="result-body" class="result-desc-box"></div>
            
            <div class="history-container" id="history-section" style="display:none;">
                <div class="history-title">📈 スコアの推移</div>
                <div class="history-chart-container">
                    <canvas id="lineChart"></canvas>
                </div>
            </div>
        </div>
        <button onclick="downloadResultImage()" class="btn-main" style="margin-top:25px; background: linear-gradient(#4CAF50, #45a049); color: white; box-shadow: 0 8px 0 #2e7d32; font-size:16px;">結果を写真で保存 📸</button>
        <button onclick="location.reload()" style="background:none; border:none; color:#aaa; margin-top:20px; cursor:pointer;">最初に戻る</button>
    </div>
</div>

<script>
    const Q_CSV_URL = "https://docs.google.com/spreadsheets/d/116tuTmwNpfl4FnpSHB8jQ8MNJb8bHGmzgm2mQ8n7fdY/export?format=csv&gid=0";
    const R_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS9pj-nSE8qg0GTy-VDTdvpDrIJuE6OiJbnE0cOyPtHoV5W98am4V3vKES6H9rlTBfaRxWcUsLuI1VE/pub?gid=1023134718&single=true&output=csv";
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyUi_zfv1Gsk2Yw6VnudCvEIrFP8lcRFE02Jc20Hz3CvOQxD9x4wIcYPTZpDMyBKGOD/exec";

    let questions = [], resultsMaster = {}, validCodes = new Set(), currentIdx = 0;
    let userCode = "";
    let scores = { A:0, B:0, C:0, D:0, E:0, F:0, G:0, H:0, N:0 };

    function parseCSV(text) {
        const rows = [];
        const lines = text.split(/\r?\n/);
        for (let line of lines) {
            if (!line.trim()) continue;
            const parts = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
            rows.push(parts.map(p => p.replace(/^"|"$/g, '').trim()));
        }
        return rows;
    }

    async function init() {
        try {
            const qRes = await fetch(Q_CSV_URL);
            const qTxt = await qRes.text();
            parseCSV(qTxt).slice(1).forEach(cols => {
                if (cols[0]) validCodes.add(cols[0].trim());
                if (cols[1]) {
                    const opts = [];
                    for(let i=2; i<=6; i++) {
                        if(cols[i]) {
                            const m = cols[i].match(/(.*)\((.)\)/);
                            if(m) opts.push({ text: m[1].trim(), type: m[2].toUpperCase() });
                        }
                    }
                    if(opts.length > 0) {
                        opts.push({ text: "どれもあてはまらない", type: "N" });
                        questions.push({ text: cols[1], options: opts });
                    }
                }
            });

            const rRes = await fetch(R_CSV_URL);
            const rTxt = await rRes.text();
            parseCSV(rTxt).slice(1).forEach(cols => {
                if(cols[0]) {
                    resultsMaster[cols[0].trim().toUpperCase()] = { 
                        emoji: cols[1], name: cols[2], desc: cols[3], catchphrase: cols[4] || "" 
                    };
                }
            });
            document.getElementById('loading-msg').innerText = "✨ 準備完了！ ✨";
            document.getElementById('start-btn').disabled = false;
        } catch (e) { 
            document.getElementById('loading-msg').innerText = "❌ 通信エラー：設定を確認してください"; 
        }
    }

    function startGame() {
        userCode = document.getElementById('group-code').value.trim();
        if (validCodes.has(userCode)) {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('quiz-area').style.display = 'block';
            showQuestion();
        } else {
            document.getElementById('code-error').style.display = 'block';
        }
    }

    function showQuestion() {
        const q = questions[currentIdx];
        document.getElementById('progress-fill').style.width = `${(currentIdx / questions.length) * 100}%`;
        document.getElementById('question-text').innerText = q.text;
        const container = document.getElementById('options-container');
        container.innerHTML = "";
        q.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.innerText = opt.text; btn.className = 'option-btn';
            btn.onclick = () => {
                if(scores[opt.type] !== undefined) scores[opt.type]++;
                currentIdx++;
                if (currentIdx < questions.length) showQuestion(); else showResult();
            };
            container.appendChild(btn);
        });
    }

    async function showResult() {
        document.getElementById('quiz-area').style.display = 'none';
        document.getElementById('result-area').style.display = 'block';
        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });

        let maxType = "A", maxVal = -1;
        let topTypes = [];
        
        // 1. A〜Hの中での最高点を探す
        for (let t in scores) { 
            if(t !== 'N') {
                if (scores[t] > maxVal) { 
                    maxVal = scores[t]; 
                    topTypes = [t]; 
                } else if (scores[t] === maxVal) {
                    topTypes.push(t);
                }
            } 
        }

        // --- ★虹色ロジックの調整ポイント ---
        // ① Nが最高点かつ、2位のタイプより2点以上多い場合のみNを採用
        // ② または、同率1位が「4つ以上」並んだ場合を「多才（虹）」とする
        if ((scores.N >= maxVal + 2) || (topTypes.length >= 4)) {
            maxType = "N";
        } else {
            // 同点の場合はランダム要素を入れるか、配列の最初を採用
            maxType = topTypes[Math.floor(Math.random() * topTypes.length)];
        }

        const res = resultsMaster[maxType] || {emoji:"❓", name:"不明", desc:"マスタ参照エラー", catchphrase:""};
        
        let headerHtml = `<span class="animal-emoji">${res.emoji}</span>`;
        if (res.catchphrase) {
            headerHtml += `<div class="result-catchphrase">${res.catchphrase}</div>`;
        }
        headerHtml += `<div class="result-title">${res.name}</div>`;
        
        document.getElementById('result-header').innerHTML = headerHtml;
        document.getElementById('result-body').innerText = res.desc;

        const currentData = [
            scores.A + scores.G + scores.C, 
            scores.B + scores.F,           
            scores.E + scores.H,           
            scores.D * 2                   
        ];

        const historyKey = `history_data_${userCode}`;
        let history = JSON.parse(localStorage.getItem(historyKey)) || [];
        const prevData = history.length > 0 ? history[history.length - 1].scores : null;

        const today = new Date().toLocaleDateString();
        history.push({ date: today, scores: currentData });
        if (history.length > 10) history.shift();
        localStorage.setItem(historyKey, JSON.stringify(history));

        const radarDatasets = [{
            label: '今回のあなた',
            data: currentData,
            backgroundColor: 'rgba(255, 105, 180, 0.5)',
            borderColor: '#FF69B4',
            borderWidth: 4,
            z: 10
        }];

        if (prevData) {
            radarDatasets.push({
                label: '前回のあなた',
                data: prevData,
                backgroundColor: 'transparent',
                borderColor: '#B2EBF2',
                borderWidth: 3,
                borderDash: [5, 5],
                z: 5
            });
        }

        new Chart(document.getElementById('radarChart'), {
            type: 'radar',
            data: { 
                labels: ['守る力', '使う力', '増やす力', '分ける力'], 
                datasets: radarDatasets 
            },
            options: { 
                responsive: true, 
                maintainAspectRatio: false, 
                scales: { r: { beginAtZero: true, suggestedMax: 12, max: 12, ticks: { stepSize: 2 } } } 
            }
        });

        if (history.length > 1) {
            document.getElementById('history-section').style.display = 'block';
            new Chart(document.getElementById('lineChart'), {
                type: 'line',
                data: {
                    labels: history.map(h => h.date),
                    datasets: [
                        { label: '守る', data: history.map(h => h.scores[0]), borderColor: '#FF69B4', tension: 0.3 },
                        { label: '使う', data: history.map(h => h.scores[1]), borderColor: '#FFD700', tension: 0.3 },
                        { label: '増やす', data: history.map(h => h.scores[2]), borderColor: '#4CAF50', tension: 0.3 },
                        { label: '分ける', data: history.map(h => h.scores[3]), borderColor: '#2196F3', tension: 0.3 }
                    ]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false, 
                    scales: { y: { beginAtZero: true, suggestedMax: 12, max: 12, ticks: { stepSize: 2 } } } 
                }
            });
        }

        const formData = new URLSearchParams();
        formData.append('groupCode', userCode);
        formData.append('type', maxType);
        formData.append('animal', res.name); 
        fetch(GAS_URL, { method: "POST", body: formData, mode: "no-cors" });
    }

    function downloadResultImage() {
        html2canvas(document.getElementById('result-content-container'), { scale: 2, backgroundColor: "#ffffff" }).then(canvas => {
            const link = document.createElement('a');
            link.download = `診断結果_${userCode}.png`;
            link.href = canvas.toDataURL(); link.click();
        });
    }
    window.onload = init;
</script>
</body>
</html>
